name: Release

# Builds the macOS, Windows and Linux downloads, smoke-tests each one on its own OS, and publishes a GitHub
# release tagged v<VERSION> (see the VERSION file).
# Manual only (Actions tab -> Release -> Run workflow), so nothing ships by accident.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build all three platforms
    runs-on: macos-15            # macOS build needs codesign (Apple Silicon only runs signed code)
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read version
        id: v
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          # Plain x.y.z only: the value becomes a tag, a title and part of shell commands below.
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::VERSION must look like 1.2.3, got: $v"; exit 1; }
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
      - name: Stop if this version is already released
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::$TAG already exists. Bump VERSION and add a CHANGELOG section first."; exit 1
          fi
      - name: Install Godot (pinned, checksum-verified)
        run: scripts/ci/install-godot.sh
      - name: Gate (import, unit tests, 600-frame autopilot run)
        run: tools/gate.sh
      - name: Public-readiness check
        run: scripts/check_public_ready.sh
      - name: Export macOS, Windows and Linux
        run: scripts/export.sh
      - name: Smoke-test the exported macOS app
        run: |
          mkdir smoke && ditto -x -k dist/SendIt-macOS.zip smoke
          python3 scripts/ci/smoke.py smoke/SendIt-*-macOS/SendIt.app/Contents/MacOS/SendIt
      - name: Test the one-line installer against this exact build
        run: scripts/ci/test-install.sh dist
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  smoke-linux:
    name: Smoke-test the Linux download
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: dist
          path: dist
      - run: |
          tar xzf dist/SendIt-Linux-x86_64.tar.gz
          python3 scripts/ci/smoke.py SendIt-*-Linux-x86_64/SendIt.x86_64
      - name: Test the one-line installer on Linux
        run: scripts/ci/test-install.sh dist

  smoke-windows:
    name: Smoke-test the Windows download
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: dist
          path: dist
      - shell: bash
        run: |
          unzip -q dist/SendIt-Windows-x86_64.zip
          python scripts/ci/smoke.py SendIt-*-Windows-x86_64/SendIt.exe
          python -m pip install --quiet pefile==2024.8.26
          python scripts/ci/check_windows_exe.py SendIt-*-Windows-x86_64/SendIt.exe

  publish:
    name: Publish the release
    needs: [build, smoke-linux, smoke-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write        # create the release and its tag
      # For the build attestation: a record, signed through GitHub, that the downloads were built by this workflow
      # from this commit. Check one with: gh attestation verify SendIt-macOS.zip --repo jedbrnth-eng/sendit
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: dist
          path: dist
      - name: Check the downloads against SHA256SUMS
        run: cd dist && sha256sum -c SHA256SUMS
      - name: Attest the downloads
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          # Plain x.y.z only: the value becomes a tag, a title and part of shell commands below.
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::VERSION must look like 1.2.3, got: $v"; exit 1; }
          # Release notes = the download steps first (for everyone), then this version's CHANGELOG section.
          cat .github/release-notes.md > notes.md
          echo >> notes.md
          awk -v h="## [$v]" 'index($0, h) == 1 {on = 1; print "## Changes in this version"; next} on && /^## \[/ {exit} on' CHANGELOG.md >> notes.md
          gh release create "v$v" dist/SendIt-macOS.zip dist/SendIt-Windows-x86_64.zip dist/SendIt-Linux-x86_64.tar.gz dist/SHA256SUMS \
            --repo "$REPO" --target "$SHA" \
            --title "SendIt v$v" --notes-file notes.md
